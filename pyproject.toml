[project]
name = "baseagent"
version = "0.1.0"
description = "Coding-agent harness with middleware, bounded tool execution and recoverable sessions"
readme = "README.md"
authors = [
    { name = "TinyPandar", email = "meiyoujunlee@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "jsonschema>=4.23,<5", # Kernel's only allowed direct third-party dependency.
    "langchain-openai>=1.6.2",
    "openai>=3.15.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tokenizers>=0.21,<1",
]

[project.scripts]
baseagent = "baseagent:main"
baseagent-ui = "baseagent.ui.launch:main"

[project.optional-dependencies]
ui = [
    "chainlit>=2.9,<3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
