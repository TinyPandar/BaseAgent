[project]
name = "baseagent"
version = "0.1.0"
description = "Coding-agent harness with middleware, bounded tool execution and recoverable sessions"
readme = "README.md"
authors = [
    { name = "TinyPandar", email = "meiyoujunlee@foxmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.15",
    "jsonschema>=4.23,<5", # Kernel's only allowed direct third-party dependency.
    "langchain-openai>=1.6.2",
    "openai>=3.15.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tokenizers>=0.21,<1",
    "chromadb>=0.6.3",
    "anthropic>=0.42.0",
]

[project.scripts]
baseagent = "baseagent:main"
baseagent-ui = "baseagent.ui.launch:main"

[project.optional-dependencies]
ui = [
    "chainlit>=2.9,<3",
]
# `baseagent --ui tui`: Textual terminal frontend for continuous chat.
tui = [
    "textual>=8,<9",
]
# Faithfulness loader target: transformers==4.57.1. Not a default dependency.
# On that release, pipeline(local_files_only=True) does not reach cached_file.
# The loader forces HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE, then passes
# local_files_only into config, tokenizer, and weight loads.
# transformers 4.57.1 requires huggingface-hub<1, which conflicts with this
# project's hub 1.x, so it is not an install extra. Use a separate environment
# when running --nli. Unit tests mock that release and do not download weights.

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
