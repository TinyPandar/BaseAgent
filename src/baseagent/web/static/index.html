<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BaseAgent</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css{{ASSET_QUERY}}">
  <link rel="stylesheet" href="/static/app.css{{ASSET_QUERY}}">
  <script src="/static/app.js{{ASSET_QUERY}}" defer></script>
</head>
<body>
  <header class="container-fluid bar">
    <strong>BaseAgent</strong>
    <span id="session" class="muted">会话：—</span>
    <span id="budget" class="muted">预算：—</span>
    <span id="connection" class="muted">连接中…</span>
  </header>
  <main class="container-fluid layout">
    <section class="chat">
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <form id="composer" class="composer">
        <input id="input" name="text" autocomplete="off" placeholder="输入任务或问题；/status、/continue [N]、/checkpoints、/undo、/cancel &lt;id|all&gt;、/tell &lt;id&gt; &lt;text&gt;、/queue &lt;text&gt;（回复中发送 = 追加到本轮）" required>
        <button type="submit">发送</button>
      </form>
    </section>
    <aside class="side">
      <article>
        <header class="row"><strong>Workers</strong><button id="cancel-all" class="outline secondary small" type="button">全部取消</button></header>
        <table class="workers">
          <thead><tr><th>id</th><th>状态</th><th>时间</th><th>模型</th><th></th></tr></thead>
          <tbody id="workers"><tr><td colspan="5" class="muted">还没有 worker</td></tr></tbody>
        </table>
      </article>
      <section id="approvals"></section>
      <article class="sidechat">
        <header class="row"><strong>侧聊</strong><span id="side-state" class="muted">未打开</span></header>
        <p class="muted small-note">只看打开时的主会话上下文，不执行工具，回答不回到主任务。关闭页面不会停止侧聊；用下面的按钮停止或结束。</p>
        <div id="side-log" class="side-log" aria-live="polite"></div>
        <form id="side-composer" class="composer">
          <input id="side-input" name="text" autocomplete="off" placeholder="侧聊提问" required>
          <button type="submit">提问</button>
        </form>
        <div class="buttons side-buttons">
          <button id="side-stop" class="outline secondary small" type="button">停止</button>
          <button id="side-retry" class="outline small" type="button">重试上一问</button>
          <button id="side-end" class="outline secondary small" type="button">结束侧聊</button>
        </div>
      </article>
    </aside>
  </main>
</body>
</html>
